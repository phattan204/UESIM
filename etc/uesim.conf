# 5G UE Simulation Configuration File

# General settings
general {
    # Number of UE instances to simulate
    num_instances = 1;
    
    # Log level (0=ERROR, 1=WARN, 2=INFO, 3=DEBUG, 4=TRACE)
    log_level = 2;
    
    # Enable verbose logging
    verbose = true;
    
    # Enable debug mode
    debug = true;
}

# Network settings
network {
    # gNB IP address (primary/serving gNB)
    gnb_ip = "127.0.0.1";
    
    # gNB NGAP port
    gnb_ngap_port = 38412;
    
    # gNB GTP-U port
    gnb_gtpu_port = 2152;
    
    # Local bind address (0.0.0.0 for all interfaces)
    local_ip = "0.0.0.0";
    
    # Local ports (0 for random)
    local_ngap_port = 0;
    local_gtpu_port = 0;
    
    # Multi-gNB support (v1.2.0)
    # Enable multiple gNB connections for handover
    multi_gnb_enabled = false;
    
    # Maximum candidate gNBs for handover
    max_candidate_gnbs = 8;
    
    # gNB type: oai, srsran, commercial, mock
    gnb_type = "oai";
    
    # RSRP threshold for handover (dBm)
    handover_rsrp_threshold = -100;
    
    # RSRQ threshold for handover (dB)
    handover_rsrq_threshold = -15;
}

# UE settings
ue {
    # IMSI range (format: MCC-MNC-MSIN)
    imsi_prefix = "00101";
    imsi_start = 1000000000;
    
    # MSISDN range
    msisdn_prefix = "12345";
    msisdn_start = 100000;
    
    # Tracking Area Code
    tac = 1;
    
    # Mobile Country Code
    mcc = "001";
    
    # Mobile Network Code
    mnc = "01";
}

# RRC settings
rrc {
    # RRC procedure timeouts (seconds)
    registration_timeout = 30;
    establishment_timeout = 30;
    reestablishment_timeout = 30;
    handover_timeout = 30;
    
    # Enable/disable specific procedures
    enable_registration = true;
    enable_establishment = true;
    enable_reestablishment = true;
    enable_handover = true;
}

# Performance settings
performance {
    # Thread pool size (0 for auto-detect)
    thread_pool_size = 0;
    
    # Buffer sizes
    rx_buffer_size = 65536;
    tx_buffer_size = 65536;
    
    # Memory pool size (bytes)
    memory_pool_size = 67108864;  # 64MB
    
    # Enable memory pool
    use_memory_pool = true;
}

# Security settings
security {
    # Enable stack protection
    stack_protection = true;
    
    # Enable ASLR
    aslr = true;
    
    # Enable secure compilation flags
    secure_flags = true;
}

# Test settings
test {
    # Enable unit tests
    enable_tests = false;
    
    # Test duration (seconds)
    test_duration = 60;
    
    # Test report file
    report_file = "/var/log/uesim/test_report.txt";
}

# Load test settings (v1.2.0)
load_test {
    enabled = false;
    num_ues = 100;
    ramp_rate = 10;
    duration = 60;
    warmup = 5;
    scenario = "burst_registration";
    report_format = "text";
    report_path = "./load_test_report";
    collect_histograms = true;
    verbose = true;
}

# QoS settings (v1.2.0)
qos {
    default_5qi = 9;
    session_ambr_uplink = 100000;
    session_ambr_downlink = 200000;
    max_flows_per_session = 8;
    max_packet_filters = 16;
    enforce_qos = false;
}
